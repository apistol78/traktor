name: Nightly Release

# Builds the release configurations of Traktor every night and publishes them
# through a single, permanent pre-release tagged "nightly".
#
# That release is created once and only ever edited afterwards; the rolling
# "nightly" tag is moved onto the new commit and the assets are replaced in
# place. Deleting and recreating it would republish it instead, and GitHub
# raises a release event on every publish - watchers subscribed to releases
# would be notified each night and the release would reappear in the dashboard
# feed of everyone who starred the repository. Editing raises no such event.
#
# Nights where master has not moved are skipped entirely, and a failed build
# replaces no assets, so the previous nightly stays available for download.
#
# The Windows Debug (DebugShared) configuration is intentionally never built or
# published here; it is only validated by build-windows-debug.yml on push.

on:
  schedule:
    # 02:00 UTC every day.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never let two nightlies create/prune releases at the same time.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
    - uses: actions/checkout@v4
      with:
        # The nightly tag is needed below, and a shallow clone omits it.
        fetch-depth: 0
    - name: Compare master against the published nightly
      id: check
      env:
        MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        set -euo pipefail

        if [ "$MANUAL" = "true" ]; then
          echo "Manual run, building regardless of history."
          echo "build=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The rolling tag points at the commit the current nightly was built
        # from, so an unmoved master means there is nothing new to publish.
        if previous="$(git rev-parse -q --verify 'refs/tags/nightly^{commit}')"; then
          if [ "$previous" = "$GITHUB_SHA" ]; then
            echo "master is still at $previous, skipping tonight's build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "master moved from $previous to $GITHUB_SHA."
        else
          echo "No nightly tag yet, building the first nightly."
        fi

        echo "build=true" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (ReleaseShared)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v4
    - name: Install 3rdp dependencies
      run: ./scripts/update-3rdp.bat
      shell: cmd
    - name: Generate build files
      run: ./scripts/build-projects-vs2026-win64.bat
      shell: cmd
    - name: Build ReleaseShared
      run: ./scripts/autobuild/autobuild-latest-win64.bat ReleaseShared
      shell: cmd
    - name: Collect archive tree
      run: ./scripts/autobuild/autobuild-archive-win64.bat
      shell: cmd
    - name: Create ZIP
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # autobuild-archive-win64.bat cannot fail the step on its own (it always
        # returns the exit code of popd), so verify the tree before packaging.
        $editor = 'build/archive/traktor/bin/latest/win64/releaseshared/Traktor.Editor.App.exe'
        if (-not (Test-Path -LiteralPath $editor)) {
          throw "Archive tree is incomplete, missing $editor"
        }

        # A reused workspace may still hold a stale zip: Compress-Archive refuses
        # to overwrite it and "7z a" would append to it.
        $out = Join-Path $PWD 'Traktor-nightly-win64.zip'
        if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Force }

        Push-Location build/archive
        try {
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=5 -r $out traktor
            if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          } else {
            Compress-Archive -Path traktor -DestinationPath $out -CompressionLevel Optimal
          }
        } finally {
          Pop-Location
        }
        Write-Host ('Created {0} ({1:N1} MB)' -f $out, ((Get-Item -LiteralPath $out).Length / 1MB))
    - name: Create installer
      run: ./scripts/autobuild/autobuild-installer-win64.bat
      shell: cmd
    - name: Name installer
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Likewise, autobuild-installer-win64.bat always exits 0; missing output
        # is caught here instead.
        Copy-Item -LiteralPath build/installer/Traktor.msi -Destination Traktor-nightly-win64.msi
    - name: Upload nightly assets
      uses: actions/upload-artifact@v4
      with:
        name: nightly-win64
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        path: |
          Traktor-nightly-win64.zip
          Traktor-nightly-win64.msi

  linux:
    name: Linux (ReleaseShared)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hendrikmuhs/ccache-action@v1.2
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages:
          build-essential
          libglu1-mesa-dev
          uuid-dev
          libgtk-3-dev
          libasound2-dev
          libopenal-dev
          libpulse-dev
          libdecor-0-dev
          mesa-vulkan-drivers
          clang
          lld
          gdb
        version: 1.0
    - name: Install 3rdp dependencies
      run: ./bin/linux/releasestatic/Traktor.Run.App ./scripts/misc/update-3rdp.run
    - name: Generate build files
      run: ./scripts/build-projects-make-linux.sh
    - name: Build ReleaseShared
      run: ./scripts/autobuild/autobuild-latest-linux.sh ReleaseShared
    - name: Collect archive tree
      run: ./scripts/autobuild/autobuild-archive-linux.sh
    - name: Create tarball
      run: |
        set -euo pipefail

        # autobuild-archive-linux.sh returns the exit code of popd, so verify the
        # tree before packaging.
        editor=build/archive/traktor/bin/latest/linux/releaseshared/Traktor.Editor.App
        if [ ! -f "$editor" ]; then
          echo "Archive tree is incomplete, missing $editor" >&2
          exit 1
        fi

        tar -czf Traktor-nightly-linux-x64.tar.gz -C build/archive traktor
        ls -lh Traktor-nightly-linux-x64.tar.gz
    - name: Upload nightly assets
      uses: actions/upload-artifact@v4
      with:
        name: nightly-linux-x64
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        path: Traktor-nightly-linux-x64.tar.gz

  release:
    name: Publish nightly release
    # Both builds must succeed before anything is published, so a broken night
    # leaves the previous nightly release untouched.
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download nightly assets
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Publish nightly release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        TAG="nightly"
        SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-8)"

        echo "Assets to publish:"
        ls -lh dist

        cat > notes.md <<NOTES
        Automated nightly build of \`master\` at commit $SHORT_SHA.

        | Asset | Contents |
        | ----- | -------- |
        | Traktor-nightly-win64.msi | Windows installer, ReleaseShared. |
        | Traktor-nightly-win64.zip | Windows portable archive, ReleaseShared plus editor data. |
        | Traktor-nightly-linux-x64.tar.gz | Linux x64 portable archive, ReleaseShared plus editor data. |

        Debug configurations are not published. These are untested automated
        builds, and this release is replaced in place every night.

        Built from $GITHUB_SHA by [run #$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
        NOTES

        # Move the rolling tag onto tonight's commit, creating it the first time.
        if ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
               -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1; then
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
        fi

        # Edit in place, never delete and recreate, so that only the very first
        # publish of this release is ever announced. The asset names are fixed,
        # so --clobber leaves nothing stale behind.
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Updating the existing $TAG release"
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" \
            --title "Traktor nightly $(date -u +'%Y-%m-%d')" \
            --notes-file notes.md \
            --prerelease
        else
          echo "Creating the $TAG release"
          # A pre-release, so an untested build never becomes the repository's
          # "Latest release".
          gh release create "$TAG" \
            --prerelease \
            --title "Traktor nightly $(date -u +'%Y-%m-%d')" \
            --notes-file notes.md \
            dist/*
        fi

        # Clean up the dated releases the previous scheme left behind. The
        # "nightly-" prefix never matches the rolling "nightly" tag itself.
        gh release list --limit 200 --json tagName --jq '.[].tagName' \
          | { grep -E '^nightly-' || true; } \
          | while read -r old; do
              echo "Removing legacy dated nightly release $old"
              gh release delete "$old" --yes --cleanup-tag
            done
